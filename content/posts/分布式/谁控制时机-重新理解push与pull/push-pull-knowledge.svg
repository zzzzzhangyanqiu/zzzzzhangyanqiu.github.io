<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#EA580C"/>
    </marker>
    <marker id="ah-pull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/>
    </marker>
  </defs>

  <!-- 白底卡片，兼容深色主题 -->
  <rect x="0.5" y="0.5" width="879" height="359" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>

  <!-- ===== push 行 ===== -->
  <text x="62" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#EA580C">
    <tspan x="62" dy="0">push</tspan>
    <tspan x="62" dy="1.5em" font-size="13" font-weight="500" fill="#9A3412">上游主动</tspan>
  </text>

  <rect x="150" y="40" width="210" height="92" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="255" y="74" text-anchor="middle" fill="#1E3A8A">
    <tspan x="255" dy="0" font-size="15" font-weight="600">上游 · 生产者</tspan>
    <tspan x="255" dy="1.7em" font-size="12.5">新鲜度知识：有没有新数据</tspan>
  </text>

  <rect x="620" y="40" width="210" height="92" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="725" y="74" text-anchor="middle" fill="#14532D">
    <tspan x="725" dy="0" font-size="15" font-weight="600">下游 · 消费者</tspan>
    <tspan x="725" dy="1.7em" font-size="12.5">能力知识：能不能接住</tspan>
  </text>

  <line x1="362" y1="86" x2="616" y2="86" stroke="#EA580C" stroke-width="2" marker-end="url(#ah-push)"/>
  <text x="489" y="62" text-anchor="middle" fill="#9A3412">
    <tspan x="489" dy="0" font-size="12.5" font-weight="600">一有新数据就发</tspan>
    <tspan x="489" dy="1.3em" font-size="11.5" fill="#B45309">低延迟 · 须自己流控</tspan>
  </text>

  <!-- ===== pull 行 ===== -->
  <text x="62" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#0891B2">
    <tspan x="62" dy="0">pull</tspan>
    <tspan x="62" dy="1.5em" font-size="13" font-weight="500" fill="#155E75">下游主动</tspan>
  </text>

  <rect x="150" y="230" width="210" height="92" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="255" y="264" text-anchor="middle" fill="#1E3A8A">
    <tspan x="255" dy="0" font-size="15" font-weight="600">上游 · 生产者</tspan>
    <tspan x="255" dy="1.7em" font-size="12.5">新鲜度知识：有没有新数据</tspan>
  </text>

  <rect x="620" y="230" width="210" height="92" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="725" y="264" text-anchor="middle" fill="#14532D">
    <tspan x="725" dy="0" font-size="15" font-weight="600">下游 · 消费者</tspan>
    <tspan x="725" dy="1.7em" font-size="12.5">能力知识：能不能接住</tspan>
  </text>

  <line x1="616" y1="276" x2="362" y2="276" stroke="#0891B2" stroke-width="2" marker-end="url(#ah-pull)"/>
  <text x="489" y="252" text-anchor="middle" fill="#155E75">
    <tspan x="489" dy="0" font-size="12.5" font-weight="600">有空了才来要</tspan>
    <tspan x="489" dy="1.3em" font-size="11.5" fill="#0E7490">天然背压 · 须轮询/通知</tspan>
  </text>
</svg>
